[llm]
llm_vision_timeout = 120
llm_text_timeout = 180
llm_max_retries = 3
text_llm_max_tokens = 16000
vision_llm_provider = "doubao"

# 豆包视觉大模型配置
vision_doubao_model_name = "ep-20260526134210-fq62r"
vision_doubao_fallback_models = ["ep-20260526134210-fq62r"]
vision_doubao_api_key = "bdddff7f-5bf7-4502-a976-418036e15591"
vision_doubao_base_url = "https://ark.cn-beijing.volces.com/api/v3"

# Qwen视觉大模型配置（保留备用）
vision_openai_model_name = "qwen3.5-122b-a10b"
# 备选大模型，由于指定的视觉大模型可能额度不够，需要调用其他备选来完成
vision_openai_fallback_models = ["qwen3.6-flash-2026-04-16", "qwen3.6-35b-a3b", "qwen3.5-plus", "qwen3.5-plus-2026-02-15", "qwen3.5-122b-a10b", "qwen3.5-397b-a17b", "qwen3.5-35b-a3b", "qwen3.5-27b"]
vision_openai_api_key = "sk-983ffed9edda4c30aa22b9fcedbd9511"
vision_openai_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# 文本大模型默认使用豆包；如需切回 DashScope/Qwen/DeepSeek，将这里改成 "openai"
text_llm_provider = "doubao"
text_openai_model_name = "deepseek-v4-pro"
text_openai_fallback_models = ["deepseek-v4-pro", "qwen3.6-flash", "qwen3.6-flash-2026-04-16"]
text_openai_api_key = "sk-983ffed9edda4c30aa22b9fcedbd9511"
text_openai_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# 豆包文本大模型配置（备用）
text_llm_model_name = "ep-20260604155430-pt5bq"
vision_llm_model_name = "ep-20260526134210-fq62r"
text_doubao_model_name = "ep-20260604155430-pt5bq"
text_doubao_fallback_models = ["ep-20260604155430-pt5bq"]
text_doubao_api_key = "bdddff7f-5bf7-4502-a976-418036e15591"
text_doubao_base_url = "https://ark.cn-beijing.volces.com/api/v3"


# 文字转语言
[omnivoice]
model_path = "models/OmniVoice"
reference_audio = "tts_ref/664925840_0_13s.mp3"
reference_text = "问一下啊，今天所有来到我直播间，宝贝现在不要离开直播间。因为身上这个小黑裙是你们家衣柜里没有过的类型，没有过的风格。我知道宝贝，你们家都有裙子，夏天谁家没有小裙子，对不对？"
speed = 0.85
default_voice_id = "default_female"

[voices.default_female]
id = "default_female"
name = "默认女声"
description = "当前系统默认参考音色，适合通用新闻解说"
style = "news"
gender = "female"
reference_audio = "tts_ref/664925840_0_13s.mp3"
reference_text = "问一下啊，今天所有来到我直播间，宝贝现在不要离开直播间。因为身上这个小黑裙是你们家衣柜里没有过的类型，没有过的风格。我知道宝贝，你们家都有裙子，夏天谁家没有小裙子，对不对？"
preview_audio = "tts_ref/664925840_0_13s.mp3"
speed = 0.85
enabled = true

# 音频转文字
[funasr]
asr_model_path = "models/iic"
device = "cuda:0"
segment_seconds = 60
segment_overlap_seconds = 1.0
max_segment_seconds = 90
startup_check = true
startup_smoke_test = false
smoke_test_seconds = 3

# 工作流与网页默认配置
[workflow]
# 默认画面比例：新闻素材优先保持原横屏；需要竖屏短视频时再手动改 9:16
default_aspect_ratio = "16:9"
default_chunk_seconds = 60
default_frame_interval = 10
vision_max_workers = 3
vision_max_frames_per_chunk = 6
# 可选：all / only_analysis / skip_render / render_only
default_run_mode = "all"
use_unified_source_pipeline = true

[common_analysis]
wait_existing_common = true
wait_timeout_seconds = 7200
wait_poll_seconds = 3
disable_pid_stale_check_on_windows = true
state_file = "common_state.json"

[multi_source_analysis]
enabled = true
source_max_workers = 2
per_source_vision_max_workers = 2
vision_global_max_workers = 4
text_global_max_workers = 4
fail_policy = "partial_success"
max_candidates_per_source = 8
max_global_candidate_clips = 40
progress_enabled = true
verbose_source_logs = true

[llm_input]
max_asr_chars_per_chunk = 320
max_visual_chars_per_chunk = 160
max_screen_text_items = 5
max_people_items = 5
max_candidate_clips_for_edit_plan = 8
candidate_neighbor_chunks = 1
max_text_agent_input_chars = 20000
max_asr_digest_input_chars = 5000
max_short_video_edit_plan_input_chars = 12000
max_voiceover_script_input_chars = 10000
max_highlight_reassembly_plan_input_chars = 10000
max_llm_sources = 20
max_llm_candidate_clips = 14
max_llm_context_chunks = 3
max_llm_key_facts = 8
max_content_analysis_preselect_input_chars = 9000
max_content_analysis_input_chars = 12000

[content_analysis_preselect]
enabled = true
direct_threshold = 10
small_total_threshold = 30
small_batch_size = 10
small_max_keep_per_batch = 5
small_max_final_candidates = 20
large_batch_size = 10
large_max_keep_per_batch = 3
large_max_final_candidates = 30
max_workers = 4
max_asr_chars_per_segment = 220
max_visual_chars_per_segment = 100
max_summary_chars_per_segment = 120
max_input_chars_per_batch = 8000
require_micro_segment_id = true
allow_empty_batch_result = true

[content_analysis]
group_by_source = true
group_when_source_count_gt = 3
max_sources_per_group = 3
max_segments_per_group = 40
max_input_chars_per_group = 10000
max_selected_segments_per_group = 6
max_final_selected_segments = 20
allow_partial_group_success = true
fallback_to_single_pass_when_empty = false

[asr_micro_segment]
enabled = true
source = "raw_asr"
fail_on_empty = true
fail_on_empty_groups = true
allow_sentence_fallback = false
min_segment_seconds = 4.0
preferred_min_segment_seconds = 8
preferred_max_segment_seconds = 22
hard_max_segment_seconds = 35.0
window_sentence_count = 40
window_overlap_sentence_count = 5
max_sentence_chars = 120
max_segments_for_content_analysis = 120
include_visual_summary = true
visual_summary_chars = 160
split_overlong_group = true
drop_empty_text_segment = true

[ai_voiceover_candidate]
padding_before_seconds = 0.5
padding_after_seconds = 0.8
min_clip_seconds = 5.0
preferred_max_clip_seconds = 45.0
max_clip_seconds = 60.0
fail_on_empty = true
truncate_overlong = false
fail_on_overlong = true
fail_on_short = false

[compat]
allow_ai_voiceover_candidate_from_content_analysis = false
allow_asr_micro_segment_from_timeline_digest = false
allow_legacy_ai_voiceover_chunk_content_analysis = false

[asr_digest]
enabled = true
model_name = "ep-20260604155430-pt5bq"
fallback_models = []
max_workers = 4
max_input_chars_per_chunk = 4000
target_chars_per_chunk = 320
target_chars_for_vision = 500
temperature = 0.0
max_tokens = 600
fail_policy = "fallback_to_compact_text"
skip_empty = true
debug = true

[voiceover_script]
max_workers = 2
model_name = "ep-20260604155430-pt5bq"
fallback_models = []
temperature = 0.2
max_tokens = 1200

# 自动修复 voiceover_script 与 editing_structure 的局部文案问题
repair_enabled = true
max_repair_rounds = 2
repair_temperature = 0.1
repair_max_tokens = 1000
